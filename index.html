<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>Mis recetas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css?v=libro1" />
  </head>
  <body>

    <div class="container">
      <header class="topbar">
        <div class="brand">
          
          <h1>Mis recetas</h1>
          <p class="subtitle">Tu recetario personal, siempre a mano.</p>
        </div>

      </header>

      <section class="search-panel" aria-label="Búsqueda y filtros">
        <label class="search-field">
          <span>Buscar receta</span>
          <input id="searchInput" type="search" placeholder="Buscar recetas o ingredientes..." />
        </label>

        <div id="chips"></div><button id="filters">Filtros</button><dialog id="filterBox" aria-label="Filtros"><header class="dialog-head"><h2>Filtros</h2><button type="button" data-dismiss autofocus aria-label="Cerrar filtros">×</button></header><div class="filters-row dialog-scroll">
          <label>
            <span>Tipo</span>
            <select id="typeFilter">
              <option value="all">Todas</option>
            </select>
          </label>

          <label>
            <span>Duración</span>
            <select id="timeFilter">
              <option value="all">Cualquiera</option>
              <option value="short">Rápida</option>
              <option value="medium">Media</option>
              <option value="long">Lenta</option>
              <option value="unknown">Sin definir</option>
            </select>
          </label>

          <label>
            <span>Sabor</span>
            <select id="profileFilter">
              <option value="all">Todas</option>
              <option value="dulce">Dulce</option>
              <option value="salado">Salado</option>
              <option value="mixto">Mixto</option>
            </select>
          </label>

          <label>
            <span>Dificultad</span>
            <select id="difficultyFilter">
              <option value="all">Todas</option>
              <option value="baja">Sencilla</option>
              <option value="media">Técnica</option>
              <option value="alta">Experta</option>
            </select>
          </label>

          <label>
            <span>Ordenar por</span>
            <select id="sortSelect">
              <option value="updated_desc">Más recientes</option>
              <option value="updated_asc">Más antiguas</option>
              <option value="title_asc">Nombre A-Z</option>
              <option value="title_desc">Nombre Z-A</option>
              <option value="prep_asc">Menos tiempo</option>
              <option value="prep_desc">Más tiempo</option>
            </select>
          </label>
        </div>

        <footer class="dialog-foot"><button id="resetFilters">Limpiar filtros</button><button id="applyFilters" class="primary">Ver resultados</button></footer></dialog><div id="activeFilters" class="active-filters" aria-live="polite"></div>
      </section>

      <section class="status-row" aria-live="polite">
        <p id="resultsLabel" class="results-label">0 recetas</p>
        <button id="btnClearFilters" class="text-btn" type="button" hidden>Limpiar filtros</button>
      </section>

      <main>
        <section id="grid" class="grid" aria-live="polite"></section>

        <section id="empty" class="empty" hidden>
          <h2>No hay recetas para mostrar</h2>
          <p>Ajusta los filtros o prueba otra búsqueda para encontrar recetas.</p>
        </section>
      </main>

      <footer class="site-footer">
        <p>Creado por Álvaro Moreno Lumbreras.</p>
        <p>Copyright © 2026. Todos los derechos reservados.</p>
      </footer>
    </div>

    <main id="page" hidden><a href="#">← Mis recetas</a><h1 id="detailTitle" tabindex="-1"></h1><section id="detailBody"></section></main>
    <template id="cardTpl">
      <a class="card">
        <div class="thumb-wrap"><img class="thumb" alt="Imagen de receta" loading="lazy" decoding="async" /></div>
        <div class="card-body">
          <h3 class="title"></h3>
          <div class="card-tags">
            <span class="tag card-tag tag-type"></span>
            <span class="tag card-tag tag-duration"></span>
            <span class="tag card-tag tag-profile"></span>
            <span class="tag card-tag tag-difficulty"></span>
          </div>
          <p class="desc"></p>
        </div>

      </a>
    </template>

    <script src="assets/js/app.js?v=libro1" defer></script>
    <script src="assets/js/recipe.js" defer></script>
  </body>
</html>
